name: olivetrace
services:
  app:
    build: .
    image: olivetrace:local
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8080}:8080"
    environment:
      APP_NAME: OliveTrace
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${DOCKER_APP_KEY:?Set DOCKER_APP_KEY in .env.docker}
      APP_URL: http://localhost:${DOCKER_HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: olivetrace
      DB_USERNAME: olivetrace
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}
      SESSION_DRIVER: database
      SESSION_COOKIE: olivetrace_docker_session
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MAIL_MAILER: log
    volumes:
      - uploads:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: olivetrace
      MYSQL_USER: olivetrace
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DOCKER_ROOT_PASSWORD:?Set DOCKER_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
  uploads:
